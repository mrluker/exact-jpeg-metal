<svg xmlns='http://www.w3.org/2000/svg' width='820' height='308' viewBox='0 0 820 308' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Exactness and robustness'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Exactness and robustness</text><text x='20' y='52' font-size='12.5' fill='#5e5c64'>Apple M1 Max (32-core GPU, 64 GB), macOS 27.2.0, AC Power, load 15.14, 2026-11-17</text><text x='20' y='70' font-size='12.5' fill='#5e5c64'>Synthetic corpus only (ejm synthetic v1); scripts/test.sh</text><rect x='20' y='88' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='34' y='128' font-size='26' font-weight='700' fill='#241f31'>582 / 582</text><text x='34' y='150' font-size='12' fill='#5e5c64'>decodes byte-identical</text><text x='34' y='166' font-size='12' fill='#5e5c64'>to libjpeg-turbo 3.2.0</text><rect x='284' y='88' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='298' y='128' font-size='26' font-weight='700' fill='#241f31'>869 / 869</text><text x='298' y='150' font-size='12' fill='#5e5c64'>encoded files</text><text x='298' y='166' font-size='12' fill='#5e5c64'>byte-identical</text><rect x='548' y='88' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='562' y='128' font-size='26' font-weight='700' fill='#241f31'>36 / 36</text><text x='562' y='150' font-size='12' fill='#5e5c64'>progressive decodes declined,</text><text x='562' y='166' font-size='12' fill='#5e5c64'>as they must be</text><rect x='20' y='194' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='34' y='234' font-size='26' font-weight='700' fill='#241f31'>200,000</text><text x='34' y='256' font-size='12' fill='#5e5c64'>fuzzed files: 0 findings</text><text x='34' y='272' font-size='12' fill='#5e5c64'>149,412 declined, 50,588 exact</text><rect x='284' y='194' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='298' y='234' font-size='26' font-weight='700' fill='#241f31'>20,000</text><text x='298' y='256' font-size='12' fill='#5e5c64'>fuzzed under shader validation:</text><text x='298' y='272' font-size='12' fill='#5e5c64'>0 reports, 0 findings</text><rect x='548' y='194' width='252' height='94' rx='8' fill='none' stroke='#deddda'/><text x='562' y='234' font-size='26' font-weight='700' fill='#241f31'>SHA-256</text><text x='562' y='256' font-size='12' fill='#5e5c64'>manifest pins the target:</text><text x='562' y='272' font-size='12' fill='#5e5c64'>libjpeg-turbo 3.2.0 outputs</text></svg>
