<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='474' viewBox='0 0 1200 474' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Routing: a JPEG goes to DeviceProfile, which measures GPU and CPU costs, warmth and load by itself; its advice (prefersCPU, routingDecision, suggestedInFlight) goes to your program, which chooses the GPU path (exact-jpeg-metal), the CPU path (its own libjpeg-turbo) or both at once; every path gives the same bytes.'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>How a JPEG is routed between the GPU and the CPU</text><text x='20' y='54' font-size='12.5' fill='#5e5c64'>exact-jpeg-metal measures the device and gives advice; your program picks the path. Every path gives the same bytes.</text><text x='170' y='88' font-size='12' font-weight='700' fill='#5e5c64'>exact-jpeg-metal, by itself</text><line x1='170' y1='95' x2='500' y2='95' stroke='#9a9996' stroke-width='1'/><text x='530' y='88' font-size='12' font-weight='700' fill='#5e5c64'>advice to your program</text><line x1='530' y1='95' x2='750' y2='95' stroke='#9a9996' stroke-width='1'/><text x='800' y='88' font-size='12' font-weight='700' fill='#5e5c64'>your program decides</text><line x1='800' y1='95' x2='1055' y2='95' stroke='#9a9996' stroke-width='1'/><rect x='20' y='210' width='120' height='94' rx='8' fill='none' stroke='#9a9996'/><text x='32' y='233.2' font-size='14' font-weight='700' fill='#241f31'>A JPEG</text><text x='32' y='255.2' font-size='12' fill='#5e5c64'>to decode, or</text><text x='32' y='271.2' font-size='12' fill='#5e5c64'>pixels to</text><text x='32' y='287.2' font-size='12' fill='#5e5c64'>encode</text><rect x='170' y='129' width='330' height='256' rx='8' fill='none' stroke='#9a9996'/><text x='182' y='152.2' font-size='14' font-weight='700' fill='#241f31'>DeviceProfile measures and tracks</text><text x='182' y='174.2' font-size='12' fill='#5e5c64'>GPU cost per image: fixed + per megapixel, for a</text><text x='182' y='190.2' font-size='12' fill='#5e5c64'>cold and a warm GPU (timed once in the</text><text x='182' y='206.2' font-size='12' fill='#5e5c64'>background, cached); a kept-fed GPU estimated</text><text x='182' y='222.2' font-size='12' fill='#5e5c64'>from its core count</text><text x='182' y='244.2' font-size='12' fill='#5e5c64'>CPU: how much slower your codec runs on a cold</text><text x='182' y='260.2' font-size='12' fill='#5e5c64'>CPU (a small CPU job it times)</text><text x='182' y='282.2' font-size='12' fill='#5e5c64'>Warmth now: its own GPU work in the last 250</text><text x='182' y='298.2' font-size='12' fill='#5e5c64'>ms, CPU work you report, this process&#39;s CPU</text><text x='182' y='314.2' font-size='12' fill='#5e5c64'>time, other apps&#39; GPU use (macOS)</text><text x='182' y='336.2' font-size='12' fill='#5e5c64'>Load: each of its own GPU calls against the</text><text x='182' y='352.2' font-size='12' fill='#5e5c64'>prediction, and your CPU jobs when you time</text><text x='182' y='368.2' font-size='12' fill='#5e5c64'>them (beginCPUWork, end)</text><rect x='530' y='156' width='220' height='202' rx='8' fill='none' stroke='#9a9996'/><text x='542' y='179.2' font-size='14' font-weight='700' fill='#241f31'>The advice</text><text x='542' y='201.2' font-size='12' fill='#5e5c64'>prefersCPU / routingDecision:</text><text x='542' y='217.2' font-size='12' fill='#5e5c64'>is your CPU codec predicted at</text><text x='542' y='233.2' font-size='12' fill='#5e5c64'>least 20% faster for this image</text><text x='542' y='249.2' font-size='12' fill='#5e5c64'>size, now?</text><text x='542' y='271.2' font-size='12' fill='#5e5c64'>suggestedInFlight: how many</text><text x='542' y='287.2' font-size='12' fill='#5e5c64'>images to keep in flight at once</text><text x='542' y='303.2' font-size='12' fill='#5e5c64'>(2 or 3)</text><text x='542' y='325.2' font-size='12' fill='#5e5c64'>Advice only: nothing switches</text><text x='542' y='341.2' font-size='12' fill='#5e5c64'>path on its own.</text><rect x='800' y='110' width='255' height='78' rx='8' fill='#1a5fb4'/><text x='812' y='133.2' font-size='14' font-weight='700' fill='#ffffff'>GPU: exact-jpeg-metal</text><text x='812' y='155.2' font-size='12' fill='#ffffff'>Decoder or Encoder: always runs on</text><text x='812' y='171.2' font-size='12' fill='#ffffff'>the GPU when called</text><rect x='800' y='202' width='255' height='94' rx='8' fill='#6b6965'/><text x='812' y='225.2' font-size='14' font-weight='700' fill='#ffffff'>CPU: libjpeg-turbo, your own</text><text x='812' y='247.2' font-size='12' fill='#ffffff'>the library has no CPU codec; also for</text><text x='812' y='263.2' font-size='12' fill='#ffffff'>the JPEGs the GPU declines</text><text x='812' y='279.2' font-size='12' fill='#ffffff'>(progressive, arithmetic)</text><rect x='800' y='310' width='255' height='94' rx='8' fill='#3d3846'/><text x='812' y='333.2' font-size='14' font-weight='700' fill='#ffffff'>Both at once</text><text x='812' y='355.2' font-size='12' fill='#ffffff'>exact-jpeg-metal batches plus</text><text x='812' y='371.2' font-size='12' fill='#ffffff'>libjpeg-turbo on the other cores (ejm</text><text x='812' y='387.2' font-size='12' fill='#ffffff'>throughput: hybrid)</text><rect x='1080' y='193' width='100' height='128' rx='8' fill='none' stroke='#9a9996'/><text x='1092' y='216.2' font-size='14' font-weight='700' fill='#241f31'>Same</text><text x='1092' y='234.2' font-size='14' font-weight='700' fill='#241f31'>bytes</text><text x='1092' y='256.2' font-size='12' fill='#5e5c64'>as</text><text x='1092' y='272.2' font-size='12' fill='#5e5c64'>libjpeg-turbo</text><text x='1092' y='288.2' font-size='12' fill='#5e5c64'>3.2.0, on</text><text x='1092' y='304.2' font-size='12' fill='#5e5c64'>every path</text><line x1='142' y1='257' x2='161' y2='257' stroke='#5e5c64' stroke-width='1'/><path d='M168.0,257.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='502' y1='257' x2='521' y2='257' stroke='#5e5c64' stroke-width='1'/><path d='M528.0,257.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='752' y1='257' x2='791' y2='149' stroke='#5e5c64' stroke-width='1'/><path d='M798.0,149.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='1057' y1='149' x2='1071' y2='257' stroke='#5e5c64' stroke-width='1'/><path d='M1078.0,257.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='752' y1='257' x2='791' y2='249' stroke='#5e5c64' stroke-width='1'/><path d='M798.0,249.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='1057' y1='249' x2='1071' y2='257' stroke='#5e5c64' stroke-width='1'/><path d='M1078.0,257.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='752' y1='257' x2='791' y2='357' stroke='#5e5c64' stroke-width='1'/><path d='M798.0,357.0 l-9,-5 v10 z' fill='#5e5c64'/><line x1='1057' y1='357' x2='1071' y2='257' stroke='#5e5c64' stroke-width='1'/><path d='M1078.0,257.0 l-9,-5 v10 z' fill='#5e5c64'/><text x='20' y='439' font-size='12' fill='#5e5c64'>From the code: DeviceProfile.swift says "the library always uses the GPU when called. Routing is advice for the caller." Decoder and Encoder never call a CPU codec; a JPEG the GPU</text><text x='20' y='456' font-size='12' fill='#5e5c64'>cannot decode is declined with its reason, and your program decodes it on the CPU.</text></svg>
