<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='880' viewBox='0 0 1200 880' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Median decode time over the 102 public test JPEGs, per device'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Median decode time over the 102 public test JPEGs, per device</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8595; Lower is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>The set of exact-gpu-jpeg: 17 images, 6 settings each, 1.2 to 39 MP. One decode at a time; per JPEG the median of 9 calls on the Macs, 15 (7 above 20 MP) on the iPhone; the bar is</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>the median over the 102 JPEGs. Each device is compared against itself.</text><text x='20' y='144' font-size='20' font-weight='700' fill='#241f31'>M1 Max</text><text x='20' y='161' font-size='12' fill='#5e5c64'>32-core GPU, macOS 27.2.0, libjpeg-turbo 3.2.0, load 2.20</text><text x='20' y='178' font-size='12' fill='#5e5c64'>at start; m1max-gpu32-2026-11-19-1333-pc-set.json</text><text x='421.3' y='144' font-size='20' font-weight='700' fill='#241f31'>M4</text><text x='421.3' y='161' font-size='12' fill='#5e5c64'>8-core GPU, macOS 26.5.2, libjpeg-turbo 3.2.1, load 1.39</text><text x='421.3' y='178' font-size='12' fill='#5e5c64'>at start; m4-gpu8-2026-11-19-1306-pc-set.json</text><text x='822.7' y='144' font-size='20' font-weight='700' fill='#241f31'>iPhone 13</text><text x='822.7' y='161' font-size='12' fill='#5e5c64'>A15, 4-core GPU, iOS 27.2, Low Power Mode off, thermal</text><text x='822.7' y='178' font-size='12' fill='#5e5c64'>nominal; iphone13-2026-11-19-1307-pc-set.json</text><text x='20' y='216' font-size='15' font-weight='700' fill='#241f31'>Median over 102 JPEGs</text><text x='20' y='242' font-size='13' font-weight='700' fill='#241f31'>M1 Max</text><line x1='20' y1='254' x2='20' y2='390' stroke='#9a9996' stroke-width='1'/><text x='20' y='405' font-size='11' fill='#5e5c64'>0</text><line x1='406.7' y1='254' x2='406.7' y2='390' stroke='#deddda' stroke-width='1'/><text x='406.7' y='405' font-size='11' fill='#5e5c64' text-anchor='middle'>10</text><line x1='793.3' y1='254' x2='793.3' y2='390' stroke='#deddda' stroke-width='1'/><text x='793.3' y='405' font-size='11' fill='#5e5c64' text-anchor='middle'>20</text><line x1='1180' y1='254' x2='1180' y2='390' stroke='#deddda' stroke-width='1'/><text x='1180' y='405' font-size='11' fill='#5e5c64' text-anchor='end'>30</text><text x='600' y='423' font-size='11.5' fill='#5e5c64' text-anchor='middle'>median wall time per JPEG (ms)</text><path d='M20,258 h93.7 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-93.7 z' fill='#1a5fb4'><title>exact-jpeg-metal: 2.53 ms &#183; 8.4x faster than libjpeg-turbo on 1 core</title></path><text x='123.7' y='276' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>exact-jpeg-metal </tspan><tspan font-size='16.2' font-weight='800'>2.53 ms</tspan><tspan font-size='12' font-weight='700'> &#183; 8.4x faster than libjpeg-turbo on 1 core</tspan></text><path d='M20,292 h821 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-821 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 21.3 ms</title></path><text x='28' y='310' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='837' y='310' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>21.3 ms</tspan></text><path d='M20,326 h522.6 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-522.6 z' fill='#277a4c'><title>Apple ImageIO: 13.6 ms</title></path><text x='28' y='344' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='538.6' y='344' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>13.6 ms</tspan></text><path d='M20,360 h462.1 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-462.1 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 12.1 ms</title></path><text x='28' y='378' font-size='12' font-weight='700' fill='#ffffff'>VideoToolbox (Apple hardware decoder)</text><text x='478.1' y='378' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>12.1 ms</tspan></text><text x='20' y='456' font-size='13' font-weight='700' fill='#241f31'>M4</text><line x1='20' y1='468' x2='20' y2='604' stroke='#9a9996' stroke-width='1'/><text x='20' y='619' font-size='11' fill='#5e5c64'>0</text><line x1='406.7' y1='468' x2='406.7' y2='604' stroke='#deddda' stroke-width='1'/><text x='406.7' y='619' font-size='11' fill='#5e5c64' text-anchor='middle'>10</text><line x1='793.3' y1='468' x2='793.3' y2='604' stroke='#deddda' stroke-width='1'/><text x='793.3' y='619' font-size='11' fill='#5e5c64' text-anchor='middle'>20</text><line x1='1180' y1='468' x2='1180' y2='604' stroke='#deddda' stroke-width='1'/><text x='1180' y='619' font-size='11' fill='#5e5c64' text-anchor='end'>30</text><text x='600' y='637' font-size='11.5' fill='#5e5c64' text-anchor='middle'>median wall time per JPEG (ms)</text><path d='M20,472 h114.1 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-114.1 z' fill='#1a5fb4'><title>exact-jpeg-metal: 3.05 ms &#183; 4.9x faster than libjpeg-turbo on 1 core</title></path><text x='144.1' y='490' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>exact-jpeg-metal </tspan><tspan font-size='16.2' font-weight='800'>3.05 ms</tspan><tspan font-size='12' font-weight='700'> &#183; 4.9x faster than libjpeg-turbo on 1 core</tspan></text><path d='M20,506 h578.5 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-578.5 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 15.1 ms</title></path><text x='28' y='524' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='594.5' y='524' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>15.1 ms</tspan></text><path d='M20,540 h516.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-516.8 z' fill='#277a4c'><title>Apple ImageIO: 13.5 ms</title></path><text x='28' y='558' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='532.8' y='558' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>13.5 ms</tspan></text><path d='M20,574 h399.3 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-399.3 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 10.4 ms</title></path><text x='28' y='592' font-size='12' font-weight='700' fill='#ffffff'>VideoToolbox (Apple hardware decoder)</text><text x='415.3' y='592' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>10.4 ms</tspan></text><text x='20' y='670' font-size='13' font-weight='700' fill='#241f31'>iPhone 13</text><text x='20' y='687' font-size='12' fill='#5e5c64'>Timed: exact-jpeg-metal and ImageIO only (no libjpeg-turbo on iOS; VideoToolbox not timed). One call at a time, the A15 GPU drops to a slow clock between calls (docs/HOW-IT-WORKS.md,</text><text x='20' y='704' font-size='12' fill='#5e5c64'>"Why one call at a time is slow on the iPhone 13"). exact-jpeg-metal was faster on 12 of the 12 JPEGs above 20 MP (2 photos at 6 settings). With two decoders in flight it beat ImageIO on</text><text x='20' y='721' font-size='12' fill='#5e5c64'>two threads from 488x480 up (synthetic photos, not this set: results/ios/iphone13-2026-11-19-0755-check.json). Decodes identical: 102 of 102; ImageIO 0 of 102.</text><line x1='20' y1='733' x2='20' y2='801' stroke='#9a9996' stroke-width='1'/><text x='20' y='816' font-size='11' fill='#5e5c64'>0</text><line x1='406.7' y1='733' x2='406.7' y2='801' stroke='#deddda' stroke-width='1'/><text x='406.7' y='816' font-size='11' fill='#5e5c64' text-anchor='middle'>10</text><line x1='793.3' y1='733' x2='793.3' y2='801' stroke='#deddda' stroke-width='1'/><text x='793.3' y='816' font-size='11' fill='#5e5c64' text-anchor='middle'>20</text><line x1='1180' y1='733' x2='1180' y2='801' stroke='#deddda' stroke-width='1'/><text x='1180' y='816' font-size='11' fill='#5e5c64' text-anchor='end'>30</text><text x='600' y='834' font-size='11.5' fill='#5e5c64' text-anchor='middle'>median wall time per JPEG (ms)</text><path d='M20,737 h653.7 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-653.7 z' fill='#1a5fb4'><title>exact-jpeg-metal: 17.0 ms &#183; 1.4x slower than ImageIO one at a time</title></path><text x='28' y='755' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal</text><text x='669.7' y='755' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>17.0 ms</tspan><tspan font-size='12' font-weight='700'> &#183; 1.4x slower than ImageIO one at a time</tspan></text><path d='M20,771 h477.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-477.8 z' fill='#277a4c'><title>Apple ImageIO: 12.5 ms</title></path><text x='28' y='789' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='493.8' y='789' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>12.5 ms</tspan></text><text x='20' y='862' font-size='12' fill='#5e5c64'>Only exact-jpeg-metal&#39;s pixels are identical to libjpeg-turbo&#39;s on every file.</text></svg>
