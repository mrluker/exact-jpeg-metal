<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='427' viewBox='0 0 1200 427' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Median decode time over the 102 public test JPEGs, per Mac'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Median decode time over the 102 public test JPEGs, per Mac</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8595; Lower is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>The set of exact-gpu-jpeg: 17 images, 6 settings each, 1.2 to 39 MP. Per JPEG the median of 9 calls; the bar is the median over the 102 JPEGs. Each column is one Mac against</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>itself.</text><text x='20' y='144' font-size='20' font-weight='700' fill='#241f31'>M1 Max</text><text x='20' y='161' font-size='12' fill='#5e5c64'>32-core GPU, macOS 27.2.0, libjpeg-turbo 3.2.0, load 2.20 at start;</text><text x='20' y='178' font-size='12' fill='#5e5c64'>m1max-gpu32-2026-11-19-1333-pc-set.json</text><text x='622' y='144' font-size='20' font-weight='700' fill='#241f31'>M4</text><text x='622' y='161' font-size='12' fill='#5e5c64'>8-core GPU, macOS 26.5.2, libjpeg-turbo 3.2.1, load 1.39 at start;</text><text x='622' y='178' font-size='12' fill='#5e5c64'>m4-gpu8-2026-11-19-1306-pc-set.json</text><text x='20' y='216' font-size='14' font-weight='700' fill='#241f31'>Median over 102 JPEGs</text><text x='622' y='216' font-size='14' font-weight='700' fill='#241f31'>Median over 102 JPEGs</text><line x1='20' y1='228' x2='20' y2='348' stroke='#9a9996' stroke-width='1'/><text x='20' y='363' font-size='11' fill='#5e5c64'>0</text><line x1='206' y1='228' x2='206' y2='348' stroke='#deddda' stroke-width='1'/><text x='206' y='363' font-size='11' fill='#5e5c64' text-anchor='middle'>10</text><line x1='392' y1='228' x2='392' y2='348' stroke='#deddda' stroke-width='1'/><text x='392' y='363' font-size='11' fill='#5e5c64' text-anchor='middle'>20</text><line x1='578' y1='228' x2='578' y2='348' stroke='#deddda' stroke-width='1'/><text x='578' y='363' font-size='11' fill='#5e5c64' text-anchor='end'>30</text><text x='299' y='381' font-size='11.5' fill='#5e5c64' text-anchor='middle'>median wall time per JPEG (ms)</text><path d='M20,232 h43 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-43 z' fill='#1a5fb4'><title>exact-jpeg-metal: 2.53 ms &#183; 8.4x faster than libjpeg-turbo on 1 core</title></path><text x='73' y='247.3' font-size='12' fill='#241f31'><tspan font-weight='700'>exact-jpeg-metal</tspan> 2.53 ms &#183; 8.4x faster than libjpeg-turbo on 1 core</text><path d='M20,262 h392.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-392.8 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 21.3 ms</title></path><text x='28' y='277.3' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='408.8' y='277.3' font-size='12' fill='#ffffff' text-anchor='end'>21.3 ms</text><path d='M20,292 h249.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-249.3 z' fill='#277a4c'><title>Apple ImageIO: 13.6 ms</title></path><text x='28' y='307.3' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='265.3' y='307.3' font-size='12' fill='#ffffff' text-anchor='end'>13.6 ms</text><path d='M20,322 h220.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-220.2 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 12.1 ms</title></path><text x='250.2' y='337.3' font-size='12' fill='#241f31'><tspan font-weight='700'>VideoToolbox (Apple hardware decoder)</tspan> 12.1 ms</text><line x1='622' y1='228' x2='622' y2='348' stroke='#9a9996' stroke-width='1'/><text x='622' y='363' font-size='11' fill='#5e5c64'>0</text><line x1='808' y1='228' x2='808' y2='348' stroke='#deddda' stroke-width='1'/><text x='808' y='363' font-size='11' fill='#5e5c64' text-anchor='middle'>10</text><line x1='994' y1='228' x2='994' y2='348' stroke='#deddda' stroke-width='1'/><text x='994' y='363' font-size='11' fill='#5e5c64' text-anchor='middle'>20</text><line x1='1180' y1='228' x2='1180' y2='348' stroke='#deddda' stroke-width='1'/><text x='1180' y='363' font-size='11' fill='#5e5c64' text-anchor='end'>30</text><text x='901' y='381' font-size='11.5' fill='#5e5c64' text-anchor='middle'>median wall time per JPEG (ms)</text><path d='M622,232 h52.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-52.8 z' fill='#1a5fb4'><title>exact-jpeg-metal: 3.05 ms &#183; 4.9x faster than libjpeg-turbo on 1 core</title></path><text x='684.8' y='247.3' font-size='12' fill='#241f31'><tspan font-weight='700'>exact-jpeg-metal</tspan> 3.05 ms &#183; 4.9x faster than libjpeg-turbo on 1 core</text><path d='M622,262 h276.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-276.2 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 15.1 ms</title></path><text x='630' y='277.3' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='894.2' y='277.3' font-size='12' fill='#ffffff' text-anchor='end'>15.1 ms</text><path d='M622,292 h246.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-246.5 z' fill='#277a4c'><title>Apple ImageIO: 13.5 ms</title></path><text x='630' y='307.3' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='864.5' y='307.3' font-size='12' fill='#ffffff' text-anchor='end'>13.5 ms</text><path d='M622,322 h190 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-190 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 10.4 ms</title></path><text x='822' y='337.3' font-size='12' fill='#241f31'><tspan font-weight='700'>VideoToolbox (Apple hardware decoder)</tspan> 10.4 ms</text><text x='20' y='409' font-size='12' fill='#5e5c64'>Only exact-jpeg-metal&#39;s pixels are identical to libjpeg-turbo&#39;s on every file.</text></svg>
