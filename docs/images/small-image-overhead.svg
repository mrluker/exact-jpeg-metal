<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='577' viewBox='0 0 1200 577' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Encoding a 1200x800 JPEG (q87 4:2:0): per-call overhead'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Encoding a 1200x800 JPEG (q87 4:2:0): per-call overhead</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8595; Lower is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>Corpus: ejm synthetic v1 (Synth.make, decode seed 11, encode seed 21); per image. Each column is one Mac against itself. Wall time is what the caller waits; GPU busy time is the</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>part the GPU spends working.</text><text x='20' y='144' font-size='20' font-weight='700' fill='#241f31'>M1 Max MacBook Pro</text><text x='20' y='161' font-size='12' fill='#5e5c64'>Apple M1 Max (32-core GPU, 64 GB), macOS 27.2.0, AC Power, load 4.48, 2026-11-18,</text><text x='20' y='178' font-size='12' fill='#5e5c64'>libjpeg-turbo 3.2.0</text><text x='622' y='144' font-size='20' font-weight='700' fill='#241f31'>M4 MacBook Air</text><text x='622' y='161' font-size='12' fill='#5e5c64'>Apple M4 (8-core GPU, 16 GB), macOS 26.5.2, AC Power, load 4.22, 2026-11-18,</text><text x='622' y='178' font-size='12' fill='#5e5c64'>libjpeg-turbo 3.2.1</text><text x='20' y='216' font-size='14' font-weight='700' fill='#241f31'>Warm GPU, one call per image</text><text x='622' y='216' font-size='14' font-weight='700' fill='#241f31'>Warm GPU, one call per image</text><line x1='20' y1='228' x2='20' y2='318' stroke='#9a9996' stroke-width='1'/><text x='20' y='333' font-size='11' fill='#5e5c64'>0</text><line x1='159.5' y1='228' x2='159.5' y2='318' stroke='#deddda' stroke-width='1'/><text x='159.5' y='333' font-size='11' fill='#5e5c64' text-anchor='middle'>2</text><line x1='299' y1='228' x2='299' y2='318' stroke='#deddda' stroke-width='1'/><text x='299' y='333' font-size='11' fill='#5e5c64' text-anchor='middle'>4</text><line x1='438.5' y1='228' x2='438.5' y2='318' stroke='#deddda' stroke-width='1'/><text x='438.5' y='333' font-size='11' fill='#5e5c64' text-anchor='middle'>6</text><line x1='578' y1='228' x2='578' y2='318' stroke='#deddda' stroke-width='1'/><text x='578' y='333' font-size='11' fill='#5e5c64' text-anchor='end'>8</text><text x='299' y='351' font-size='11.5' fill='#5e5c64' text-anchor='middle'>wall time per call (ms)</text><path d='M20,232 h40.6 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-40.6 z' fill='#1a5fb4'><title>exact-jpeg-metal, wall time: 0.64 ms &#183; 3.4x faster than libjpeg-turbo on 1 core</title></path><text x='70.6' y='247.3' font-size='12' fill='#241f31'><tspan font-weight='700'>exact-jpeg-metal, wall time</tspan> 0.64 ms &#183; 3.4x faster than libjpeg-turbo on 1 core</text><path d='M20,262 h19.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-19.7 z' fill='#0d3b70'><title>exact-jpeg-metal, GPU busy time: 0.34 ms</title></path><text x='49.7' y='277.3' font-size='12' fill='#241f31'><tspan font-weight='700'>exact-jpeg-metal, GPU busy time</tspan> 0.34 ms</text><path d='M20,292 h146.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-146.7 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 2.16 ms</title></path><text x='176.7' y='307.3' font-size='12' fill='#241f31'><tspan font-weight='700'>libjpeg-turbo, 1 CPU core</tspan> 2.16 ms</text><line x1='622' y1='228' x2='622' y2='318' stroke='#9a9996' stroke-width='1'/><text x='622' y='333' font-size='11' fill='#5e5c64'>0</text><line x1='761.5' y1='228' x2='761.5' y2='318' stroke='#deddda' stroke-width='1'/><text x='761.5' y='333' font-size='11' fill='#5e5c64' text-anchor='middle'>2</text><line x1='901' y1='228' x2='901' y2='318' stroke='#deddda' stroke-width='1'/><text x='901' y='333' font-size='11' fill='#5e