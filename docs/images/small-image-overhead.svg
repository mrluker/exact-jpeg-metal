<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1013' viewBox='0 0 1200 1013' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Encoding a 1200x800 JPEG (q87 4:2:0): per-call overhead'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Encoding a 1200x800 JPEG (q87 4:2:0): per-call overhead</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8595; Lower is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>Corpus: ejm synthetic v1 (Synth.make, decode seed 11, encode seed 21); per image. Each Mac is compared against itself. Wall time is what the caller waits; GPU busy time is the</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>part the GPU spends working.</text><text x='20' y='144' font-size='20' font-weight='700' fill='#241f31'>M1 Max MacBook Pro</text><text x='20' y='161' font-size='12' fill='#5e5c64'>Apple M1 Max (32-core GPU, 64 GB), macOS 27.2.0, AC Power, load 4.48, 2026-11-18,</text><text x='20' y='178' font-size='12' fill='#5e5c64'>libjpeg-turbo 3.2.0</text><text x='622' y='144' font-size='20' font-weight='700' fill='#241f31'>M4 MacBook Air</text><text x='622' y='161' font-size='12' fill='#5e5c64'>Apple M4 (8-core GPU, 16 GB), macOS 26.5.2, AC Power, load 4.22, 2026-11-18,</text><text x='622' y='178' font-size='12' fill='#5e5c64'>libjpeg-turbo 3.2.1</text><text x='20' y='216' font-size='15' font-weight='700' fill='#241f31'>Warm GPU, one call per image</text><text x='20' y='242' font-size='13' font-weight='700' fill='#241f31'>M1 Max MacBook Pro</text><line x1='20' y1='254' x2='20' y2='356' stroke='#9a9996' stroke-width='1'/><text x='20' y='371' font-size='11' fill='#5e5c64'>0</text><line x1='406.7' y1='254' x2='406.7' y2='356' stroke='#deddda' stroke-width='1'/><text x='406.7' 