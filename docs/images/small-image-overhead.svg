.7' y2='536' stroke='#deddda' stroke-width='1'/><text x='406.7' y='551' font-size='11' fill='#5e5c64' text-anchor='middle'>1</text><line x1='793.3' y1='434' x2='793.3' y2='536' stroke='#deddda' stroke-width='1'/><text x='793.3' y='551' font-size='11' fill='#5e5c64' text-anchor='middle'>2</text><line x1='1180' y1='434' x2='1180' y2='536' stroke='#deddda' stroke-width='1'/><text x='1180' y='551' font-size='11' fill='#5e5c64' text-anchor='end'>3</text><text x='600' y='569' font-size='11.5' fill='#5e5c64' text-anchor='middle'>wall time per call (ms)</text><path d='M20,438 h286 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-286 z' fill='#1a5fb4'><title>exact-jpeg-metal, wall time: 0.75 ms &#183; 2.0x faster than libjpeg-turbo on 1 core</title></path><text x='28' y='456' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal, wall time</text><text x='316' y='456' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>0.75 ms</tspan><tspan font-size='12' font-weight='700'> &#183; 2.0x faster than libjpeg-turbo on 1 core</tspan></text><path d='M20,472 h146.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-146.8 z' fill='#0d3b70'><title>exact-jpeg-metal, GPU busy time: 0.39 ms</title></path><text x='176.8' y='490' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>exact-jpeg-metal, GPU busy time </tspan><tspan font-size='16.2' font-weight='800'>0.39 ms</tspan></text><path d='M20,506 h576 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-576 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 1.50 ms</title></path><text x='28' y='524' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='592' y='524' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>1.50 ms</tspan></text><text x='20' y='614' font-size='15' font-weight='700' fill='#241f31'>First call after 5 s idle (one call)</text><text x='20' y='640' font-size='13' font-weight='700' fill='#241f31'>M1 Max MacBook Pro</text