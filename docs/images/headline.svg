<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='393' viewBox='0 0 1280 393' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Left: decoding big_building (39 MP), exact-jpeg-metal 7.17 ms, libjpeg-turbo, 1 CPU core 136 ms, Apple ImageIO 67.8 ms, VideoToolbox (Apple hardware decoder) 52.3 ms. Right: pixels identical to libjpeg-turbo, exact-jpeg-metal 102 of 102, Apple ImageIO 0 of 102, VideoToolbox 0 of 102.'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='19' font-weight='700' fill='#241f31'>Decode one 39 MP camera photo, one at a time</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8595; Lower is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>big_building from imagecompression.info, quality 95 4:2:0, 39 MP, median of 9 calls; M1 Max,</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>32-core GPU.</text><text x='660' y='34' font-size='19' font-weight='700' fill='#241f31'>Pixels identical to libjpeg-turbo, on 102 public test</text><text x='660' y='57.8' font-size='19' font-weight='700' fill='#241f31'>JPEGs</text><rect x='660' y='69.8' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='672' y='86' font-size='12' font-weight='700' fill='#1d1d1b'>&#8593; Higher is better</text><text x='660' y='111.8' font-size='12.5' fill='#5e5c64'>Each decoder&#39;s RGB output compared byte for byte with libjpeg-turbo&#39;s.</text><line x1='20' y1='131.8' x2='20' y2='267.8' stroke='#9a9996' stroke-width='1'/><text x='20' y='282.8' font-size='11' fill='#5e5c64'>0</text><line x1='220' y1='131.8' x2='220' y2='267.8' stroke='#deddda' stroke-width='1'/><text x='220' y='282.8' font-size='11' fill='#5e5c64' text-anchor='middle'>50</text><line x1='420' y1='131.8' x2='420' y2='267.8' stroke='#deddda' stroke-width='1'/><text x='420' y='282.8' font-size='11' fill='#5e5c64' text-anchor='middle'>100</text><line x1='620' y1='131.8' x2='620' y2='267.8' stroke='#deddda' stroke-width='1'/><text x='620' y='282.8' font-size='11' fill='#5e5c64' text-anchor='end'>150</text><text x='320' y='300.8' font-size='11.5' fill='#5e5c64' text-anchor='middle'>wall time to decode the image (ms)</text><path d='M20,135.8 h24.7 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-24.7 z' fill='#1a5fb4'><title>exact-jpeg-metal: 7.17 ms &#183; 19.0x faster than libjpeg-turbo on 1 core</title></path><text x='54.7' y='153.8' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>exact-jpeg-metal </tspan><tspan font-size='16.2' font-weight='800'>7.17 ms</tspan><tspan font-size='12' font-weight='700'> &#183; 19.0x faster than libjpeg-turbo on 1 core</tspan></text><path d='M20,169.8 h541.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-541.8 z' fill='#6b6965'><title>libjpeg-turbo, 1 CPU core: 136 ms</title></path><text x='28' y='187.8' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, 1 CPU core</text><text x='557.8' y='187.8' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>136 ms</tspan></text><path d='M20,203.8 h267.1 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-267.1 z' fill='#277a4c'><title>Apple ImageIO: 67.8 ms</title></path><text x='28' y='221.8' font-size='12' font-weight='700' fill='#ffffff'>Apple ImageIO</text><text x='283.1' y='221.8' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>67.8 ms</tspan></text><path d='M20,237.8 h205.3 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-205.3 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 52.3 ms</title></path><text x='235.3' y='255.8' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>VideoToolbox (Apple hardware decoder) </tspan><tspan font-size='16.2' font-weight='800'>52.3 ms</tspan></text><text x='20' y='323.8' font-size='11.5' fill='#5e5c64'>exact-jpeg-metal&#39;s pixels are byte-identical to libjpeg-turbo&#39;s; Apple ImageIO&#39;s and VideoToolbox&#39;s</text><text x='20' y='339.8' font-size='11.5' fill='#5e5c64'>are not (right panel).</text><line x1='660' y1='131.8' x2='660' y2='233.8' stroke='#9a9996' stroke-width='1'/><text x='660' y='248.8' font-size='11' fill='#5e5c64'>0%</text><line x1='810' y1='131.8' x2='810' y2='233.8' stroke='#deddda' stroke-width='1'/><text x='810' y='248.8' font-size='11' fill='#5e5c64' text-anchor='middle'>25%</text><line x1='960' y1='131.8' x2='960' y2='233.8' stroke='#deddda' stroke-width='1'/><text x='960' y='248.8' font-size='11' fill='#5e5c64' text-anchor='middle'>50%</text><line x1='1110' y1='131.8' x2='1110' y2='233.8' stroke='#deddda' stroke-width='1'/><text x='1110' y='248.8' font-size='11' fill='#5e5c64' text-anchor='middle'>75%</text><line x1='1260' y1='131.8' x2='1260' y2='233.8' stroke='#deddda' stroke-width='1'/><text x='1260' y='248.8' font-size='11' fill='#5e5c64' text-anchor='end'>100%</text><text x='960' y='266.8' font-size='11.5' fill='#5e5c64' text-anchor='middle'>files with pixels identical to libjpeg-turbo (% of the files)</text><path d='M660,135.8 h596 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-596 z' fill='#1a5fb4'><title>exact-jpeg-metal: 102 of 102 identical</title></path><text x='668' y='153.8' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal</text><text x='1252' y='153.8' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>102 of 102 identical</tspan></text><path d='M660,169.8 h1 a1,1 0 0 1 1,1 v24 a1,1 0 0 1 -1,1 h-1 z' fill='#277a4c'><title>Apple ImageIO: 0 of 102 identical &#183; max diff 110</title></path><text x='668' y='187.8' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>Apple ImageIO </tspan><tspan font-size='16.2' font-weight='800'>0 of 102 identical</tspan><tspan font-size='12' font-weight='700'> &#183; max diff 110</tspan></text><path d='M660,203.8 h1 a1,1 0 0 1 1,1 v24 a1,1 0 0 1 -1,1 h-1 z' fill='#613583'><title>VideoToolbox (Apple hardware decoder): 0 of 102 identical &#183; max diff 255</title></path><text x='668' y='221.8' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>VideoToolbox (Apple hardware decoder) </tspan><tspan font-size='16.2' font-weight='800'>0 of 102 identical</tspan><tspan font-size='12' font-weight='700'> &#183; max diff 255</tspan></text><text x='660' y='289.8' font-size='11.5' fill='#5e5c64'>17 images from imagecompression.info and libjpeg-turbo&#39;s test frames, 6 settings each: the same set</text><text x='660' y='305.8' font-size='11.5' fill='#5e5c64'>as exact-gpu-jpeg (https://github.com/mrluker/exact-gpu-jpeg).</text><text x='660' y='326.8' font-size='11.5' fill='#5e5c64'>max diff: the largest difference in one 8-bit channel value (0 to 255). VideoToolbox outputs BGRA, so</text><text x='660' y='342.8' font-size='11.5' fill='#5e5c64'>its comparison includes its own YCbCr to RGB conversion.</text><line x1='20' y1='356.8' x2='1260' y2='356.8' stroke='#deddda' stroke-width='1'/><text x='20' y='376.8' font-size='12' fill='#5e5c64'>Data: results/public/m1max-gpu32-2026-11-19-1333-pc-set.json. Measured on one Mac: M1 Max, 32-core GPU.</text></svg>
