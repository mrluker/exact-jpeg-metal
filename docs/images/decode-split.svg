<svg xmlns='http://www.w3.org/2000/svg' width='760' height='1564' viewBox='0 0 760 1564' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Decoding a batch on the GPU and the CPU at once'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='34' font-size='20' font-weight='700' fill='#241f31'>Decoding a batch on the GPU and the CPU at once</text><rect x='20' y='46' width='142.5' height='24' rx='12' fill='#f6d32d' stroke='#1d1d1b' stroke-width='1.5'/><text x='32' y='62.3' font-size='12' font-weight='700' fill='#1d1d1b'>&#8593; Higher is better</text><text x='20' y='88' font-size='12.5' fill='#5e5c64'>Synthetic camera-like JPEGs (Synth.make), 16 distinct per size, taken in turn from one shared queue; every</text><text x='20' y='106' font-size='12.5' fill='#5e5c64'>decoded image compared byte for byte with libjpeg-turbo&#39;s (all identical). Median of 3 interleaved rounds of 2 s</text><text x='20' y='124' font-size='12.5' fill='#5e5c64'>per variant (decodes completed within the window), every bar from the same run. Each Mac is compared against</text><text x='20' y='142' font-size='12.5' fill='#5e5c64'>itself.</text><text x='20' y='180' font-size='20' font-weight='700' fill='#241f31'>M1 Max MacBook Pro</text><text x='20' y='197' font-size='12' fill='#5e5c64'>Apple M1 Max (32-core GPU, 64 GB), macOS 27.2.0, AC Power, load 1.51, 2026-11-19, libjpeg-turbo 3.2.0</text><text x='20' y='214' font-size='12' fill='#5e5c64'>CPU: 10 cores (8 performance + 2 efficiency)</text><text x='20' y='252' font-size='14' font-weight='700' fill='#241f31'>Decode 1600x1200 q90 4:2:0 (2 MP)</text><text x='20' y='270' font-size='12' font-weight='700' fill='#5e5c64'>Split: 2 GPU decoders + 9 libjpeg-turbo threads; the GPU decoded 26% of the images</text><line x1='20' y1='282' x2='20' y2='384' stroke='#9a9996' stroke-width='1'/><text x='20' y='399' font-size='11' fill='#5e5c64'>0</text><line x1='200' y1='282' x2='200' y2='384' stroke='#deddda' stroke-width='1'/><text x='200' y='399' font-size='11' fill='#5e5c64' text-anchor='middle'>1000</text><line x1='380' y1='282' x2='380' y2='384' stroke='#deddda' stroke-width='1'/><text x='380' y='399' font-size='11' fill='#5e5c64' text-anchor='middle'>2000</text><line x1='560' y1='282' x2='560' y2='384' stroke='#deddda' stroke-width='1'/><text x='560' y='399' font-size='11' fill='#5e5c64' text-anchor='middle'>3000</text><line x1='740' y1='282' x2='740' y2='384' stroke='#deddda' stroke-width='1'/><text x='740' y='399' font-size='11' fill='#5e5c64' text-anchor='end'>4000</text><text x='380' y='417' font-size='11.5' fill='#5e5c64' text-anchor='middle'>throughput (images/s)</text><path d='M20,286 h125.5 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-125.5 z' fill='#1a5fb4'><title>exact-jpeg-metal, 2 in flight: 720 images/s</title></path><text x='155.5' y='304' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>exact-jpeg-metal, 2 in flight </tspan><tspan font-size='16.2' font-weight='800'>720 images/s</tspan></text><path d='M20,320 h274.5 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-274.5 z' fill='#3d3846'><title>libjpeg-turbo, all 10 CPU cores: 1547 images/s</title></path><text x='28' y='338' font-size='12' font-weight='700' fill='#ffffff'>libjpeg-turbo, all 10 CPU cores</text><text x='304.5' y='338' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>1547 images/s</tspan></text><path d='M20,354 h356.5 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-356.5 z' fill='#1a5fb4'><title>exact-jpeg-metal + libjpeg-turbo on 9 cores: 2003 images/s &#183; 1.29x the best single path</title></path><text x='28' y='372' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal + libjpeg-turbo on 9 cores</text><text x='386.5' y='372' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>2003 images/s</tspan><tspan font-size='12' font-weight='700'> &#183; 1.29x the best single path</tspan></text><text x='20' y='462' font-siz