metal + libjpeg-turbo on 9 cores</text><text x='417' y='582' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>814 images/s</tspan><tspan font-size='12' font-weight='700'> &#183; 1.75x the best single path</tspan></text><text x='20' y='672' font-size='14' font-weight='700' fill='#241f31'>Decode 4032x3024 q90 4:2:0 (12 MP)</text><text x='20' y='690' font-size='12' font-weight='700' fill='#5e5c64'>Split: 2 GPU decoders + 9 libjpeg-turbo threads; the GPU decoded 52% of the images</text><line x1='20' y1='702' x2='20' y2='804' stroke='#9a9996' stroke-width='1'/><text x='20' y='819' font-size='11' fill='#5e5c64'>0</text><line x1='200' y1='702' x2='200' y2='804' stroke='#deddda' stroke-width='1'/><text x='200' y='819' font-size='11' fill='#5e5c64' text-anchor='middle'>250</text><line x1='380' y1='702' x2='380' y2='804' stroke='#deddda' stroke-width='1'/><text x='380' y='819' font-size='11' fill='#5e5c64' text-anchor='middle'>500</text><line x1='560' y1='702' x2='560' y2='804' stroke='#deddda' stroke-width='1'/><text x='560' y='819' font-size='11' fill='#5e5c64' text-anchor='middle'>750</text><line x1='740' y1='702' x2='740' y2='804' stroke='#deddda' stroke-width='1'/><text x='740' y='819' font-size='11' fill='#5e5c64' text-anchor='end'>1000</text><text x='380' y='837' font-size='11.5' fill='#5e5c64' text-anchor='middle'>throughput (images/s)</text><path d='M20,706 h259.2 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-259.2 z' fill='#1a5fb4'><title>exact-jpeg-metal, 2 in flight: 366 images/s</title></path><text x='28' y='724' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal, 2 in flight</text><text x='289.2' y='724' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>366 images/s</tspan></text><path d='M20,740 h170.6 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-170.6 z' fill='#3d3846'><title>libjpeg-turbo, all 10 CPU cores: 242 images/s</title></path><text x='200.6' y='758' xml:space='preserve' fill='#241f31'><tspan font-s