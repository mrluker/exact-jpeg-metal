ddle'>throughput (images/s)</text><path d='M20,1126 h372.2 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-372.2 z' fill='#1a5fb4'><title>exact-jpeg-metal, 2 in flight: 209 images/s</title></path><text x='28' y='1144' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal, 2 in flight</text><text x='388.2' y='1144' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>209 images/s</tspan></text><path d='M20,1160 h185 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-185 z' fill='#3d3846'><title>libjpeg-turbo, all 10 CPU cores: 105 images/s</title></path><text x='215' y='1178' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>libjpeg-turbo, all 10 CPU cores </tspan><tspan font-size='16.2' font-weight='800'>105 images/s</tspan></text><path d='M20,1194 h363.2 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-363.2 z' fill='#1a5fb4'><title>exact-jpeg-metal + libjpeg-turbo on 9 cores: 204 images/s &#183; 0.98x the best single path</title></path><text x='28' y='1212' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal + libjpeg-turbo on 9 cores</text><text x='393.2' y='1212' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>204 images/s</tspan><tspan font-size='12' font-weight='700'> &#183; 0.98x the best single path</tspan></text><text x='20' y='1302' font-size='14' font-weight='700' fill='#241f31'>Decode 6720x4480 q95 4:2:2 (30 MP)</text><text x='20' y='1320' font-size='12' font-weight='700' fill='#5e5c64'>Split: 2 GPU decoders + 9 libjpeg-turbo threads; the GPU decoded 58% of the images</text><line x1='20' y1='1332' x2='20' y2='1434' stroke='#9a9996' stroke-width='1'/><text x='20' y='1449' font-size='11' fill='#5e5c64'>0</text><line x1='200' y1='1332' x2='200' y2='1434' stroke='#deddda' stroke-width='1'/><text x='200' y='1449' font-size='11' fill='#5e5c64' text-anchor='middle'>100</text><line x1='380' y1='1332' x2='380' y2='1434' stroke='#deddda' stroke-width='1'/><text x='380' y='1449' font-size='11' fill='#5e5c64' text-anchor='middle'>200</text><line x1='560' y1='1332' x2='560' y2='1434' stroke='#deddda' stroke-width='1'/><text x='560' y='1449' font-size='11' fill='#5e5c64' text-anchor='middle'>300</text><line x1='740' y1='1332' x2='740' y2='1434' stroke='#deddda' stroke-width='1'/><text x='740' y='1449' font-size='11' fill='#5e5c64' text-anchor='end'>400</text><text x='380' y='1467' font-size='11.5' fill='#5e5c64' text-anchor='middle'>throughput (images/s)</text><path d='M20,1336 h338 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-338 z' fill='#1a5fb4'><title>exact-jpeg-metal, 2 in flight: 190 images/s</title></path><text x='28' y='1354' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal, 2 in flight</text><text x='354' y='1354' xml:space='preserve' fill='#ffffff' text-anchor='end'><tspan font-size='16.2' font-weight='800'>190 images/s</tspan></text><path d='M20,1370 h131.9 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-131.9 z' fill='#3d3846'><title>libjpeg-turbo, all 10 CPU cores: 75.5 images/s</title></path><text x='161.9' y='1388' xml:space='preserve' fill='#241f31'><tspan font-size='12' font-weight='700'>libjpeg-turbo, all 10 CPU cores </tspan><tspan font-size='16.2' font-weight='800'>75.5 images/s</tspan></text><path d='M20,1404 h301.1 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-301.1 z' fill='#1a5fb4'><title>exact-jpeg-metal + libjpeg-turbo on 9 cores: 170 images/s &#183; 0.89x the best single path</title></path><text x='28' y='1422' font-size='12' font-weight='700' fill='#ffffff'>exact-jpeg-metal + libjpeg-turbo on 9 cores</text><text x='331.1' y='1422' xml:space='preserve' fill='#241f31'><tspan font-size='16.2' font-weight='800'>170 images/s</tspan><tspan font-size='12' font-weight='700'> &#183; 0.89x the best single path</tspan></text><text x='20' y='1495' font-size='12' fill='#5e5c64'>The split runs 2 exact-jpeg-metal decoder threads and N libjpeg-turbo threads on the same queue; N = cores - 1,</text><text x='20' y='1512' font-size='12' fill='#5e5c64'>declared in advance (the record also has N = cores - 2, never used to pick the gain).</text><text x='20' y='1529' font-size='12' fill='#5e5c64'>Its gain is the split&#39;s rate over the faster of GPU only and CPU only (libjpeg-turbo on every core, one image per core)</text><text x='20' y='1546' font-size='12' fill='#5e5c64'>in the same run.</text></svg>
